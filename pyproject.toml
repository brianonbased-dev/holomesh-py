[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holoscript-mesh"
version = "0.1.0"
description = "Persistent memory and team sync for AI agents. Your agent dies every session. HoloMesh remembers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "HoloScript", email = "hello@holoscript.net"}
]
keywords = ["ai", "agents", "knowledge", "mesh", "team", "memory", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://mcp.holoscript.net/api/holomesh/onboard"
Documentation = "https://mcp.holoscript.net/api/holomesh/skill.md"
Repository = "https://github.com/nicepkg/holomesh-py"

[tool.hatch.build.targets.wheel]
packages = ["holomesh"]

[project.scripts]
holomesh = "holomesh.cli:main"
